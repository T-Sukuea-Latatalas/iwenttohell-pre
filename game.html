<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Platformer</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="game-container">
    <!-- ヘッドアップディスプレイ (HP制廃止、所持アイテム状態を表示) -->
    <header id="hud">
      <div class="hud-group">
        <div class="hud-item">
          <span class="hud-label">STATUS:</span>
          <span id="hud-status" class="hud-value">NORMAL</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">CORE:</span>
          <span id="hud-energy" class="hud-value">0</span>
        </div>
      </div>
      <div class="hud-group">
        <div class="hud-item">
          <span class="hud-label">STAGE:</span>
          <span id="hud-stage-name" class="hud-value">Sector 1</span>
        </div>
      </div>
    </header>

    <!-- メインCanvas -->
    <canvas id="game-canvas" width="384" height="216"></canvas>

    <!-- ゲームオーバー画面（クリックリスタート廃止・明示的なキー操作案内のみ） -->
    <div id="overlay-gameover" class="overlay-screen">
      <div class="overlay-title gameover">SYSTEM OFFLINE</div>
      <div class="overlay-subtitle">コアシステム停止</div>
      <div class="overlay-status">[R] キーで再起動</div>
    </div>

    <!-- ステージクリア画面 -->
    <div id="overlay-clear" class="overlay-screen">
      <div class="overlay-title clear">MISSION COMPLETE!</div>
      <div id="clear-score-text" class="overlay-subtitle">ミッション完了</div>
      <div class="overlay-status">[R] キーで最初からプレイ</div>
    </div>
  </div>

  <!-- スクリプト順次読み込み -->
  <script src="js/common/constants.js"></script>
  <script src="js/common/sprites.js"></script>
  <script src="js/common/tilemap.js"></script>
  <script src="js/game/camera.js"></script>
  <script src="js/game/physics.js"></script>
  <script src="js/game/player.js"></script>
  <script src="js/game/enemy.js"></script>
  <script src="js/game/game-main.js"></script>
</body>
</html>
