<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Stage Editor</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="editor-app">
    <!-- 最上部ヘッダー -->
    <header id="header-bar">
      <div class="header-left">
        <span class="app-title">STAGE BUILDER</span>
        <div class="dimension-group">
          <label for="input-width">W:</label>
          <input type="number" id="input-width" min="10" max="250" value="60">
        </div>
        <div class="dimension-group">
          <label for="input-height">H:</label>
          <input type="number" id="input-height" min="10" max="60" value="18">
        </div>
        <button id="btn-resize">サイズ適用</button>
      </div>

      <div class="header-right">
        <button id="btn-clear" class="danger">クリア</button>
        <button id="btn-io">JSON</button>
        <button id="btn-testplay" class="primary">▶ テストプレイ</button>
      </div>
    </header>

    <!-- 上部オブジェクトトレイ（配置オブジェクト一覧） -->
    <section id="object-tray-bar">
      <span class="tray-title">PARTS</span>
      <div id="object-palette-list">
        <!-- JSで空白以外の全オブジェクトを横並び生成 -->
      </div>
    </section>

    <!-- メイン編集領域 -->
    <div id="workspace">
      <!-- 左サイド：編集モード切替ツールバー -->
      <aside id="action-sidebar">
        <!-- 鉛筆（配置）モード -->
        <button id="tool-pen" class="tool-btn active" title="配置ツール (Q)">
          <span>✏️</span>
          <span class="tool-key-badge">Q</span>
        </button>

        <!-- 消しゴムモード -->
        <button id="tool-eraser" class="tool-btn" title="消しゴム (E)">
          <span>🧹</span>
          <span class="tool-key-badge">E</span>
        </button>

        <div class="tool-divider"></div>

        <!-- 範囲選択モード -->
        <button id="tool-select" class="tool-btn" title="範囲選択 (S)">
          <span>🔲</span>
          <span class="tool-key-badge">S</span>
        </button>

        <!-- 複製ツール -->
        <button id="tool-duplicate" class="tool-btn" title="選択範囲を複製 (D)">
          <span>📋</span>
          <span class="tool-key-badge">D</span>
        </button>
      </aside>

      <!-- 広域キャンバス -->
      <main id="canvas-viewport">
        <canvas id="editor-canvas"></canvas>
      </main>
    </div>

    <!-- 下部ステータスバー -->
    <footer id="statusbar">
      <div id="status-coords">COORD: (X: 0, Y: 0)</div>
      <div id="status-mode">MODE: 配置 [地面ブロック]</div>
      <div id="status-hint">ショートカット: [Q]鉛筆 | [E]消しゴム | [S]範囲選択 | [D]複製 | [Esc]選択解除</div>
    </footer>
  </div>

  <!-- JSON入出力モーダル -->
  <div id="modal-io" class="modal-overlay">
    <div class="modal-window">
      <div class="modal-header">
        <span>ステージデータ JSON</span>
        <button id="btn-modal-close">×</button>
      </div>
      <div class="modal-body">
        <textarea id="io-textarea" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button id="btn-copy-json">コピー</button>
        <button id="btn-download-json">ダウンロード</button>
        <button id="btn-import-json" class="primary">反映</button>
      </div>
    </div>
  </div>

  <!-- スクリプト読み込み -->
  <script src="js/common/constants.js"></script>
  <script src="js/common/sprites.js"></script>
  <script src="js/common/tilemap.js"></script>
  <script src="js/editor/editor-canvas.js"></script>
  <script src="js/editor/editor-ui.js"></script>
  <script src="js/editor/editor-main.js"></script>
</body>
</html>
